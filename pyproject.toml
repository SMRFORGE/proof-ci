[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proof-ci"
version = "0.1.0"
description = "Agent-native CI layer: fast, structured, local-first checks for coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Chris Whalen" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "platformdirs>=4.0",
  "mcp>=1.10,<3",         # low-level Server; 1.x decorators and 2.x constructor handlers both supported
  "jsonschema>=4.20",     # MCP argument validation
  "anyio>=4.5",           # MCP stdio server and worker threads
  "cryptography>=42.0",
  "rfc8785>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-jsonschema>=4.0",             # mypy: stubs for MCP argument validation
  "types-PyYAML>=6.0",                 # mypy: stubs for the CI discovery adapters
  "pytest-xdist>=3.5",                # tests: the M4 xdist passthrough check
  "jsonschema>=4.18",                 # tests: validate examples against the bundled schemas
]

[project.scripts]
proof-ci = "proof_ci.cli:app"

# No [project.entry-points.pytest11]: the plugin is loaded explicitly with
# `-p proof_ci.pytest_plugin` by the runner (Section 5.10). An entry point would
# autoload the plugin into every pytest run on the machine and would register
# the module twice when the runner also passes -p.

[tool.hatch.build.targets.wheel]
packages = ["src/proof_ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["proof_ci"]

[tool.importlinter]
root_package = "proof_ci"
# Needed so external packages (vendor SDKs, mcp) can appear in contracts.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core_must_not_import_vendor_sdks"
type = "forbidden"
source_modules = [
  "proof_ci.affected",
  "proof_ci.cache",
  "proof_ci.cli",
  "proof_ci.config",
  "proof_ci.discover",
  "proof_ci.flakes",
  "proof_ci.models",
  "proof_ci.pytest_plugin",
  "proof_ci.record",
  "proof_ci.redact",
  "proof_ci.runner",
  "proof_ci.savings",
  "proof_ci.util",
]
forbidden_modules = [
  "github",
  "gitlab",
  "atlassian",
  "msrest",
  "azure",
  "anthropic",
  "openai",
  "mcp",
]
# Core may reach the MCP library only through proof_ci.adapters.agent (the
# `mcp` CLI command imports the adapter lazily), so only direct imports count.
allow_indirect_imports = true
