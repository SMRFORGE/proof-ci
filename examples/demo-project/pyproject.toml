[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "demo"
version = "0.1.0"
description = "Tiny demo package for exercising proof-ci (has one deliberately failing test)."
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
