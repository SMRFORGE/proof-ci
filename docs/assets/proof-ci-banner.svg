<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="proof-ci by SMRFORGE">
  <rect width="1200" height="630" fill="#0d2a4f"/>
  <g transform="translate(300 315)">
    <!-- hexagon frame -->
    <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
    <!-- inner hexagon -->
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="#3b8cff"/>
    <!-- check mark -->
    <polyline points="-30,2 -8,24 34,-22" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="450" y="345" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="128" font-weight="600" fill="#ffffff">proof<tspan fill="#3b8cff">-</tspan>ci</text>
  <text x="456" y="410" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" letter-spacing="8" fill="#6aa7ff">BY SMRFORGE</text>
  <text x="456" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#9cc3ff">Fast, structured checks for coding agents.</text>
</svg>
